version: "3.9"

services:
  db:
    image: postgres:17
    container_name: sc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: studentdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d studentdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sc_net

  app:
    build:
      context: ./backend
    container_name: sc_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: studentdb
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sc_net

volumes:
  db_data:

networks:
  sc_net:
    driver: bridge
